<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3분 데브 — 해외 개발 브리핑</title>
<meta name="description" content="Hacker News와 GitHub 트렌딩에서 고른 해외 개발 소식을 3줄 요약과 한 줄 평으로 정리합니다.">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="3분 데브 — 해외 개발 브리핑">
<meta property="og:description" content="오늘의 해외 개발 소식, 3줄 요약과 한 줄 평.">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="3분 데브 RSS" href="feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111114'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2322C58B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" aria-label="3분 데브 홈">3분 데브<span class="dot">.</span></a>
    <a class="rss" href="feed.xml" title="RSS로 구독">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2.5 6.7a6.8 6.8 0 0 1 6.8 6.8M2.5 2.5a11 11 0 0 1 11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="3.4" cy="12.6" r="1.3" fill="currentColor"/>
      </svg>
      RSS
    </a>
  </div>
</header>

<div class="wrap">
  <main class="main">

    <header class="masthead">
      <div class="dateline">
        <div class="date-wrap">
          <button class="date-btn" id="date-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="calendar">
            <span class="date" id="date">2026. 11. 24 화요일</span>
            <svg class="caret" width="9" height="9" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.2 6.4 8 10.2l3.8-3.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="calendar" id="calendar" role="dialog" aria-label="발행일 달력" hidden>
            <div class="cal-head">
              <button class="cal-arrow" id="cal-prev" type="button" aria-label="이전 달">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.4 4.2 5.6 8l3.8 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="cal-label" id="cal-label">2026년 11월</span>
              <button class="cal-arrow" id="cal-next" type="button" aria-label="다음 달">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.6 4.2 10.4 8l-3.8 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <div class="cal-week" aria-hidden="true">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
        </div>

        <div class="step">
          <button class="step-btn" id="prev-issue" type="button" aria-label="이전 호">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.2 4.4 5.8 8l3.4 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="step-btn" id="next-issue" type="button" aria-label="다음 호">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.8 4.4 10.2 8l-3.4 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <h1 id="masthead-title">오늘의 해외 개발 소식</h1>
    </header>

    <nav class="filters" aria-label="출처">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">전체</button>
      <button class="filter" type="button" data-filter="hn" aria-pressed="false">Hacker News</button>
      <button class="filter" type="button" data-filter="github" aria-pressed="false">GitHub</button>
    </nav>

    <div class="feed" id="feed" aria-live="polite">
      <noscript><p class="fallback">이 피드는 자바스크립트로 data/ 의 JSON을 읽어 그립니다. RSS(feed.xml)로도 같은 내용을 받을 수 있습니다.</p></noscript>
    </div>

    <footer class="footer">
      <p class="footer-brand">3분 데브<span class="dot">.</span></p>
      <p class="footer-note">Hacker News와 GitHub 트렌딩에서 고른 소식을 평일 아침에 올립니다. 원문은 직접 읽는 쪽이 언제나 낫습니다.</p>
      <div class="footer-links">
        <a href="feed.xml">RSS로 구독</a>
        <nav class="archive" id="archive" aria-label="지난 호"></nav>
      </div>
    </footer>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
